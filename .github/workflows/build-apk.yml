name: Build Turbo Kart APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        run: unzip TurboKart_APK.zip -d extracted

      - name: Compiler le jeu
        run: gradle --no-daemon -p extracted/TurboKart_Android assembleDebug

      - name: Recuperer le APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Kart-APK
          path: extracted/TurboKart_Android/app/build/outputs/apk/debug/app-debug.apk
