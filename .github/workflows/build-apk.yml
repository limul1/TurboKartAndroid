name: Build Turbo Kart APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager introuvable"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet
        shell: bash
        run: |
          set -euo pipefail
          unzip -q TurboKart_APK.zip -d extracted
          echo "Fichiers Gradle trouvés :"
          find extracted -maxdepth 6 -type f -name 'settings.gradle*' -print
          echo "Aperçu de l'archive :"
          find extracted -maxdepth 4 -type f | head -100

      - name: Compiler le jeu
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find extracted -type f -name 'settings.gradle.kts' -print -quit)"
          fi
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR: aucun settings.gradle dans l'archive. Le projet Android manque."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" --no-daemon assembleDebug
          else
            gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Recuperer le APK
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-Kart-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
